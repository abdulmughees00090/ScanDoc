<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanDoc - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f7f9f4 0%, #e8edf2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .offline-card {
      background: white;
      border-radius: 28px;
      padding: 48px 32px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 48px rgba(0,0,0,0.12);
      border: 1px solid rgba(76,175,80,0.2);
    }
    .offline-icon {
      width: 96px;
      height: 96px;
      background: linear-gradient(45deg, #FFEB3B, #4CAF50);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 48px;
    }
    h1 {
      font-family: 'Inter', 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1a2e1c;
    }
    p {
      color: #4a5568;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(45deg, #FFEB3B, #4CAF50);
      color: #1a2e1c;
      font-weight: 600;
      border-radius: 40px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(76,175,80,0.3);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(76,175,80,0.4);
    }
    .retry-link {
      margin-top: 20px;
      display: inline-block;
      color: #4CAF50;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .retry-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">
      🔌
    </div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again. Once you're back online, ScanDoc will work perfectly.</p>
    <button class="btn" onclick="location.reload()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M2 9a7 7 0 0 1 12-4.5M16 9a7 7 0 0 1-12 4.5M9 2v4l-3-2 3-2zM9 16v-4l3 2-3 2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Retry
    </button>
    <br />
    <a href="/" class="retry-link">← Return to home</a>
  </div>
</body>
</html>
